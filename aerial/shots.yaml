    look: [[0, -9800, 2600, 470], [1, -4800, 3000, 470]]

  G01_wheat_ears_macro:       # 正俯拍田块肌理，缓慢旋转推进（灌浆期麦田）
    sr: x4plus
    date: "20240512"
    region: [-11000, 1000, -1000, 9000]
