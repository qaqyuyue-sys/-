# 真实地理数据航拍镜头定义
#
# 坐标：以杨凌城区中心（UTM 49N  E230427 / N3796196，约 34.272°N 108.072°E）为原点，
#       e = 向东米数，n = 向北米数，h = 海拔米数（地面约 450–520m，渭河约 420m）
# 影像：Sentinel-2 L2A 真彩色 10m（Copernicus，GCS 公共数据集），日期见 date
# 地形：Copernicus DEM GLO-30（AWS 公共数据集）
# cam/look：[u, e, n, h]，u 为镜头内归一化时间 0–1，Catmull-Rom 插值 + 缓入缓出
# region：细节层范围 [e0, n0, e1, n1]（米），其余由全区底图补齐到地平线
# sky：dawn | day | golden | dusk          clouds：云层不透明度（0 = 无）
# wipe：季节扫过效果，按顺序在多个日期间切换

defaults:
  fov: 42
  exaggeration: 1.25
  date: "20250616"
  sky: golden
  clouds: 0

shots:
  A01_dawn_aerial:            # 片头：晨曦中自秦岭上空俯冲向杨凌
    vis: 62000
    sky: dawn
    clouds: 0.85
    region: [-26000, -32000, 22000, 16000]
    cam:  [[0, -9000, -36000, 11000], [0.6, -5000, -24000, 6500], [1, -3000, -17000, 4600]]
    look: [[0, -1000, 0, 500], [1, 0, 2000, 480]]

  A02_wheat_aerial_sunrise:   # 金色田野低空横移
    sr: general
    region: [-16000, -6000, 2000, 10000]
