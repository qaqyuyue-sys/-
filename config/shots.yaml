  desc: 西北农林科技大学校园（主楼/北校区）航拍
  camera: 由远及近推向主楼
  local: true
  queries: ["university campus aerial", "campus building aerial"]

G04_lab_seedlings:
  kind: macro
  desc: 实验室组培苗/试管苗特写，无人或只有手部
  camera: 固定或滑轨微移
  local: false
  queries: ["plant tissue culture lab", "seedlings laboratory petri"]

G05_greenhouse_dolly:
  kind: ground
  desc: 现代智能温室内部纵深，作物成排
  camera: 沿过道匀速前推
  local: false
  queries: ["modern greenhouse interior", "greenhouse rows plants"]

G06_hydroponics_closeup:
