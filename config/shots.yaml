# 镜头库：每个镜头 id 对应 footage/<id>.mp4
#
# 本片的成片画面由 aerial/ 用真实卫星影像与高程渲染（见 aerial/shots.yaml）。
# 本文件保留图库检索/实拍替换用的说明：想换成实拍或图库素材时，
# python make.py footage 会按下面的检索词下载，或手动放入同名文件覆盖。
#
# kind:     aerial（航拍） | ground（地面机位） | macro（特写/微距） | timelapse（延时）
# camera:   运镜要求，供实拍或挑选素材时参考
# local:    true = 必须是杨凌实景（地标镜头），图库里找不到，
#           需向杨凌示范区融媒体中心 / 官方宣传部门申请授权，或自行航拍；
#           false = 通用农业/自然镜头，可用 Pexels / Pixabay 免版税素材替代
# queries:  图库自动检索关键词（按顺序尝试）
# start:    可选，素材入点（秒），跳过开头不稳的部分
#
# 全片挑选标准：≥1920x1080（优先 4K 下采样）、画面干净、无人物或人物极小、
# 无水印/字幕/台标、光线统一（晨昏暖调为主）。

A01_dawn_aerial:
  kind: aerial
  desc: 晨曦中的杨凌城区与田野全景，薄雾，太阳初升
  camera: 高空缓慢前推，地平线居中偏上
  local: true
  queries: ["sunrise aerial farmland mist", "aerial city sunrise fog"]

A02_wheat_aerial_sunrise:
  kind: aerial
  desc: 金色麦田航拍，逆光
  camera: 低空贴麦浪平移
  local: false
  queries: ["wheat field aerial sunset", "golden wheat drone"]

G01_wheat_ears_macro:
  kind: macro
  desc: 麦穗在风中摇曳，浅景深逆光
  camera: 固定机位或缓慢横移
  local: false
  queries: ["wheat ears close up sunlight", "wheat macro wind"]

A03_weihe_river_aerial:
  kind: aerial
  desc: 渭河蜿蜒穿过平原，河面反光
  camera: 高空沿河道前推
  local: true
  queries: ["river aerial plain winding", "aerial river meander"]

G02_wetland_reeds:
  kind: ground
  desc: 渭河湿地芦苇与水面
  camera: 低机位缓慢横移
  local: false
  queries: ["reeds wetland sunrise", "wetland reeds water"]

A04_city_skyline_aerial:
  kind: aerial
  desc: 杨凌城区天际线全景（示范区核心区）
  camera: 环绕或缓慢横移
  local: true
  queries: ["aerial modern city china", "city skyline aerial green"]

A05_avenue_hyperlapse:
  kind: timelapse
  desc: 城市主干道车流延时（如神农路、新桥路）
  camera: 俯拍延时，车灯拖影
  local: true
  queries: ["city road aerial timelapse", "traffic avenue aerial"]

G03_modern_building_lowangle:
  kind: ground
  desc: 示范区现代建筑仰拍，玻璃幕墙映蓝天
  camera: 仰拍缓慢上摇
  local: true
  queries: ["modern building low angle glass sky", "glass building looking up"]

A06_campus_aerial:
